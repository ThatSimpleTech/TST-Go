name: Android release (Google Play)

# Run by hand: Actions tab -> "Android release (Google Play)" -> Run workflow.
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64  the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD       keystore password
#   ANDROID_KEY_ALIAS               key alias (tstgo in keystore.properties.example)
#   ANDROID_KEY_PASSWORD            key password
#   PLAY_SERVICE_ACCOUNT_JSON       Play Console service account key (only to upload)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      upload:
        description: "Upload to Google Play (off = just build the signed .aab)"
        type: boolean
        default: true
      draft:
        description: "Create the release as a draft (required if the app was never published)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing upload key secrets. Add ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tst-go-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Check Play access
        if: ${{ inputs.upload }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::Missing PLAY_SERVICE_ACCOUNT_JSON. Add it, or rerun with upload off and upload the .aab in Play Console."
            exit 1
          fi

      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thatsimpletech.tstgo
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          # Production always lands as a draft so a person sends it for review in Play Console.
          status: ${{ (inputs.draft || inputs.track == 'production') && 'draft' || 'completed' }}

      - name: Remove signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties
