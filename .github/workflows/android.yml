name: Android build

on:
  push:
    branches-ignore:
      - "ci/**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Keep one debug signing key across runs so each new test APK installs over the
      # last one. (Without this, every run makes a new key and Android refuses the update.)
      - name: Reuse the test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tstgo-debug-keystore-v1
      - name: Build debug APK and release bundle
        # The release bundle here is signed with the debug key; it only checks that a
        # release build (including Play's lint checks) succeeds. See android-release.yml.
        run: ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Live address search check (report only)
        continue-on-error: true
        env:
          GEOCODE_LIVE: "1"
          GEOCODE_REPORT: ${{ github.workspace }}/geocode/report.md
        run: ./gradlew testDebugUnitTest --tests '*AddressTest.liveAddressSearch' --rerun --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geocode
          path: geocode
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: tst-go-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Installs the APK on clean emulators and walks through the reported bugs:
  # pick a spot, let Android kill the app, reopen, and stop GPS every way.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tst-go-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android emulator (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: apk/app-debug.apk
          OUT: smoke-api${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-api${{ matrix.api }}
          path: smoke-api${{ matrix.api }}

  # Puts the APK and test results on the ci/android-output branch so they can be
  # fetched with git (no GitHub sign-in or zip download needed).
  publish:
    needs: [build, smoke]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to ci/android-output
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          mv tst-go-debug-apk/app-debug.apk ./tst-go-debug.apk
          rmdir tst-go-debug-apk
          printf 'commit=%s\nbranch=%s\nsmoke=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "${{ needs.smoke.result }}" > BUILD_INFO
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Android build and emulator results for $GITHUB_SHA"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/android-output
