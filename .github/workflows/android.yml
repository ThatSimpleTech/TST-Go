name: Android build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and release bundle
        # The release bundle here is signed with the debug key; it only checks that a
        # release build (including Play's lint checks) succeeds. See android-release.yml.
        run: ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tst-go-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
